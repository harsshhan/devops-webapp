name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          echo "Checking website files..."
          test -f index.html
          echo "index.html exists"

      - name: Build website
        run: |
          echo "Building static website..."
          mkdir -p build
          cp *.html build/
          cp *.css build/ 2>/dev/null || true
          cp *.js build/ 2>/dev/null || true
          echo "Build completed successfully"

      - name: Display build information
        run: |
          echo "Build completed at:"
          date
          echo "Build files:"
          ls -la build

      - name: Slack Success Notification
        if: success()
        run: |
          curl -X POST \
            -H "Content-type: application/json" \
            --data '{"text":"CI Pipeline succeeded for ${{ github.repository }}"}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Slack Failure Notification
        if: failure()
        run: |
          curl -X POST \
            -H "Content-type: application/json" \
            --data '{"text":"CI Pipeline failed for ${{ github.repository }}"}' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"